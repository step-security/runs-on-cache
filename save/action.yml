name: 'Save a cache'
description: 'Save Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'step-security'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache'
    required: true
  key:
    description: 'An explicit key for saving the cache'
    required: true
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to save caches that can be restored on other platforms'
    default: 'false'
    required: false
  immutable:
    description: 'S3 only: prevent replacing an existing object with conditional publication'
    default: 'false'
  fail-on-save-error:
    description: 'Fail the action if saving the cache fails instead of warning'
    default: 'false'
  force-gzip:
    description: 'S3 only: use gzip even when zstd is installed, for portable archives'
    default: 'false'
runs:
  using: 'node24'
  main: '../dist/save-only/index.js'
branding:
  icon: 'archive'
  color: 'gray-dark'
